<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/base :: head(pageTitle='Dashboard')}"></head>
<body>
<th:block th:replace="~{layouts/base :: header}"></th:block>

<div th:fragment="content">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem;">
        <h1 style="font-size: 2rem;">📋 Scenarios</h1>
        <a href="/scenarios/create" class="btn btn-primary">+ Create Scenario</a>
    </div>

    <div th:if="${scenarios.isEmpty()}" class="card">
        <p style="color: #8a9a8a;">No scenarios found. <a href="/scenarios/create" style="color:#b0d4b0;">Create your first scenario</a> to get started.</p>
    </div>

    <div class="grid-2" th:each="scenario : ${scenarios}">
        <div class="card">
            <div class="card-title" th:text="${scenario.name}">Scenario Name</div>
            <div class="card-subtitle" th:text="${scenario.description} ?: 'No description'">Description</div>
            <div style="margin-top: 0.8rem; display: flex; gap: 0.8rem; flex-wrap: wrap;">
                <span class="badge" th:text="'Events: ' + ${scenario.events.size()}">Events: 5</span>
                <span class="badge" th:text="'Start: ' + ${scenario.startEventId}">Start: zombie-attack</span>
            </div>
            <div style="margin-top: 1rem; display: flex; gap: 0.6rem; flex-wrap: wrap;">
                <a th:href="'/game/start/' + ${scenario.id}" class="btn btn-primary">▶ Play</a>
                <a th:href="'/scenarios/' + ${scenario.id}" class="btn btn-outline">View Details →</a>
                <form th:action="'/scenarios/' + ${scenario.id} + '/delete'" method="post"
                      onsubmit="return confirm('Delete this entire scenario and all its events? This cannot be undone.');" style="display:inline;">
                    <button type="submit" class="btn btn-outline" style="color:#d08080;">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layouts/base :: footer}"></th:block>
</body>
</html>
