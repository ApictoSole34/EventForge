services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventforge}
      POSTGRES_USER: ${POSTGRES_USER:-eventforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventforge}
    ports:
      - "5433:5432"
    volumes:
      - eventforge_pg_data:/var/lib/postgresql/data

volumes:
  eventforge_pg_data: